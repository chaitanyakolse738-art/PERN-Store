services:

  db: 
      image: postgres:16
      container_name: pern-store-db
      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB} 
      ports:
        - ${POSTGRES_PORT}:5432
      volumes:
        - db-data:/var/lib/postgresql/data
        - ./server/config/init.sql:/docker-entrypoint-initdb.d/init.sql
         
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
        interval: 10s
        timeout: 5s
        retries: 5
      restart: unless-stopped

 






  

  server:
    build: 
     context: ./server
     dockerfile: Dockerfile
    container_name: pern-store-server
    env_file:
       - ./server/.env

    ports:
      - 8000:9000
    
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9000/health', (res) => { if (res.statusCode === 200) { process.exit(0); } else { process.exit(1); } }).on('error', (e) => { process.exit(1); })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
        



  client:
    build: 
      context: ./client
      dockerfile: Dockerfile
    container_name: frontend-pern-store
    env_file:
        - ./client/.env
    ports:
      - 3003:3000

    depends_on:
        server:
           condition: service_healthy
    restart: unless-stopped
      


volumes:
  db-data:


      
    

    
  